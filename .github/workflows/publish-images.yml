name: Publish Code Interpreter images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Immutable image version to publish
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  publish:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - name: api
            dockerfile: service/Dockerfile.api
            target: production
          - name: worker
            dockerfile: service/Dockerfile.worker
            target: production
          - name: sandbox-runner
            dockerfile: api/Dockerfile
            target: sandbox-runner-default
          - name: file-server
            dockerfile: service/Dockerfile
            target: production
          - name: tool-call-server
            dockerfile: service/Dockerfile.tool-call-server
            target: production
          - name: egress-gateway
            dockerfile: service/Dockerfile.egress-gateway
            target: production
    name: Publish ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/codeapi-${{ matrix.name }}:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/codeapi-${{ matrix.name }}:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
